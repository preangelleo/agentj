# agentj web client — m.agentj.app + legacy alpha-web.agentjarvis.net (one version cycle) (static, public but noindex; host + method checks and CSP in worker.ts).
# Deploy: see web/README.md. Token comes from the environment (cf-mint), never from this file.
name = "agentjarvis-web"
main = "worker.ts"
compatibility_date = "2026-09-01"
# account_id = "<your Cloudflare account id>"

# Only the custom domain exists; no *.workers.dev, no preview URLs.
workers_dev = false
preview_urls = false

routes = [
  { pattern = "m.agentj.app", custom_domain = true },
  { pattern = "alpha-web.agentjarvis.net", custom_domain = true },   # legacy: paired phones keep their keys there
]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true   # every request goes through worker.ts (host + method checks, CSP pinned to the relay)

[vars]
# Publisher-owned only. Empty means the exact formal handler for every seat.
PREVIEW_CONFIG = '{"v":1,"seats":{"lwlbelrv":{"bundleSha256":"9e2c50cce1563b3d7dfd5b474b5407c2e6a3d48e5ab29aa1a0c4d4a75b2ef742","manifestSha256":"1380d788275717aa4d98b8db95a7601fcafd42f1228806fde207ec8106cfd9de","combined":"e6af5cb7c3f43fa0866c8c32f313a4d4ca84beba3330d17f85daaf9adb009c7b","hostPublicKey":"VQ-ncUUZJ4gMpaCPbG-1hngYzkzy6sOrII7lZ-fE6kY"}}}'
WEB_HOST = "m.agentj.app"
LEGACY_WEB_HOST = "alpha-web.agentjarvis.net"
RELAY_URL = "wss://relay.agentj.app"
LEGACY_RELAY_URL = "wss://alpha-relay.agentjarvis.net"

# PR1: no request logging.
[observability]
enabled = false

# #547: nonce-only metadata store; no chat, pairing secrets, or approval payloads.
[[durable_objects.bindings]]
name = "PREVIEW_NONCES"
class_name = "PreviewNonces"

[[migrations]]
tag = "preview-v1"
new_sqlite_classes = ["PreviewNonces"]
