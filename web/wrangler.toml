# agentjarvis web client — alpha-web.agentjarvis.net (static, public but noindex; host + method checks and CSP in worker.ts).
# Deploy: see web/README.md. Token comes from the environment (cf-mint), never from this file.
name = "agentjarvis-web"
main = "worker.ts"
compatibility_date = "2026-09-01"
# account_id = "<your Cloudflare account id>"

# Only the custom domain exists; no *.workers.dev, no preview URLs.
workers_dev = false
preview_urls = false

routes = [
  { pattern = "alpha-web.agentjarvis.net", custom_domain = true },
]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true   # every request goes through worker.ts (host + method checks, CSP pinned to the relay)

[vars]
WEB_HOST = "alpha-web.agentjarvis.net"
RELAY_URL = "wss://alpha-relay.agentjarvis.net"

# PR1: no request logging.
[observability]
enabled = false
