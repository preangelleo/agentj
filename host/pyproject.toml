[project]
name = "agentj"
dynamic = ["version"]            # single source: agentj/__init__.py (`agentj --version`)
description = "Agent J on your computer (`agentj`): talk to your own Claude Code, Codex or OpenCode from your phone, end-to-end encrypted"
requires-python = ">=3.11"       # tested on 3.11 and 3.13; uv fetches an interpreter by itself when the system one is older
license = "Apache-2.0"
dependencies = [
  "cryptography>=44,<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "cryptography>=44; sys_platform != 'darwin' or platform_machine != 'x86_64'", # X25519 / Ed25519 / AES-GCM
  "websockets>=14",     # relay connection
  "python-socks[asyncio]>=2.5,<3", # environment and macOS system SOCKS proxies
  "pypinyin>=0.55,<1", # local Chinese wake-word phonemes
  "tomlkit>=0.13,<1", # preserves native Codex configuration comments during provider switches
  "json5>=0.12,<1", # pure-data commented user configuration
  "pypdf>=5,<7",       # P82: host-local PDF knowledge extraction (no executable actions)
  "segno>=1.6",         # terminal QR
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://agentj.app"
Source = "https://github.com/preangelleo/agentj"

[project.scripts]
agentj = "agentj.cli:main"
# no `jarvis` script on purpose: a fresh install never gets that name (and uv never refuses because another program owns
# ~/.local/bin/jarvis); computers that migrate from 0.9 get a `jarvis` symlink from agentj/alias.py instead

[dependency-groups]
dev = ["noiseprotocol==0.3.1"]   # test-only third oracle for the Noise state machine; never imported at runtime

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "agentj/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["agentj", "jarvis_host"]   # the package + its data files (admin/ page) + the ≤ 0.9 compatibility shim; tests never ship
# admin/ ships the page, its zh/en dictionaries and the synced brand core (fonts + shield images, ~0.5 MB); the Chinese
# copy source (polished into admin.zh.json by agentjarvis/i18n/polish.py) stays in the repo.
exclude = ["agentj/admin/i18n/*.src.json", "agentj/admin/i18n/*.override.json"]

[tool.hatch.build.targets.sdist]
include = ["agentj", "jarvis_host", "pyproject.toml"]
